[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failure-complementarity"
version = "0.1.0"
description = "Failure-conditioned recovery and failure complementarity between coding agents"
requires-python = ">=3.11"
dependencies = [
  "mini-swe-agent==2.4.6",
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
